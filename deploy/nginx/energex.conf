# Nginx site for the ENERGEX website.
# Proxies to the Next.js server (systemd unit energex.service) on 127.0.0.1:3100.
#
# Install:  sudo cp deploy/nginx/energex.conf /etc/nginx/sites-available/energex
#           sudo ln -s /etc/nginx/sites-available/energex /etc/nginx/sites-enabled/energex
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d energex.co.in -d www.energex.co.in
#           (Certbot adds the 443 server block and the HTTP→HTTPS redirect.)

upstream energex_app {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # Replace with your domain. Until DNS points here, browse the VM's external IP
    # (works when this is the only site enabled, or add `default_server` to the listen lines).
    server_name energex.co.in www.energex.co.in;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Next.js needs inline scripts/styles; the contact page embeds Google Maps.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://energex_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/energex.access.log;
    error_log  /var/log/nginx/energex.error.log;
}
